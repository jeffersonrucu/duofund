<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DuoFund - Finanças a Dois</title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

   

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

       

        body {

            font-family: 'Inter', sans-serif;

            background-color: #f8f9fb;

        }

       

        .progress-bar-container { height: 8px; }



        /* Estilos do Modal */

        .modal-overlay {

            visibility: hidden;

            opacity: 0;

            transition: opacity 0.3s, visibility 0.3s;

        }

        .modal-overlay.active {

            visibility: visible;

            opacity: 1;

        }

        .modal-content {

            transform: translateY(-20px);

            transition: transform 0.3s ease-out;

        }

        .modal-overlay.active .modal-content {

            transform: translateY(0);

        }



        /* Estilos de Navegação */

        .nav-link.active button {

            color: white !important;

            background-color: #2674D9 !important; /* Cor Primária */

            font-weight: 600;

            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05) inset;

        }

        .nav-link button {

            color: #4b5563;

            background-color: transparent;

            padding: 8px 12px;

            border-radius: 0.5rem;

            transition: background-color 0.15s, color 0.15s;

        }

        .nav-link button:hover:not(.active) {

            color: #2674D9;

            background-color: #eff6ff;

        }

    </style>

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        primary: '#2674D9',

                        secondary: '#4184DD',

                        accent: '#E2B93B',

                    }

                }

            }

        }

    </script>

</head>

<body class="min-h-screen flex flex-col bg-gray-50">



    <!-- Cabeçalho -->

    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-10">

        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">

            <!-- Logo e Navegação -->

            <div class="flex items-center space-x-6">

                <a href="#" onclick="navigateTo('dashboard')" class="text-xl font-extrabold text-gray-800 flex items-center">

                    <span class="text-primary">Duo</span>Fund <span class="text-sm font-normal text-gray-500 ml-2 border-l pl-2">Juntos</span>

                </a>

               

                <nav id="main-nav" class="hidden lg:flex space-x-1">

                    <a href="#" onclick="navigateTo('dashboard')" data-page="dashboard" class="nav-link">

                        <button class="flex items-center"><i data-lucide="layout-dashboard" class="w-4 h-4 mr-2"></i>Painel</button>

                    </a>

                    <a href="#" onclick="navigateTo('expenses')" data-page="expenses" class="nav-link">

                        <button class="flex items-center"><i data-lucide="receipt" class="w-4 h-4 mr-2"></i>Despesas</button>

                    </a>

                    <a href="#" onclick="navigateTo('budget')" data-page="budget" class="nav-link">

                        <button class="flex items-center"><i data-lucide="target" class="w-4 h-4 mr-2"></i>Orçamento</button>

                    </a>

                    <a href="#" onclick="navigateTo('goals')" data-page="goals" class="nav-link">

                        <button class="flex items-center"><i data-lucide="trophy" class="w-4 h-4 mr-2"></i>Metas</button>

                    </a>

                </nav>

            </div>



            <!-- Usuário -->

            <div class="flex items-center space-x-3">

                <p id="user-status" class="text-xs text-gray-400 hidden sm:block">Carregando...</p>

                <div class="w-8 h-8 bg-primary rounded-full flex items-center justify-center text-white font-bold text-xs shadow-md" id="user-avatar">

                    U

                </div>

            </div>

        </div>

        <!-- Navegação Mobile -->

        <div class="lg:hidden flex justify-around py-2 bg-gray-50 border-t text-xs">

            <button onclick="navigateTo('dashboard')" class="flex flex-col items-center text-gray-600 hover:text-primary"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></button>

            <button onclick="navigateTo('goals')" class="flex flex-col items-center text-gray-600 hover:text-primary"><i data-lucide="trophy" class="w-5 h-5"></i></button>

            <button onclick="openModal('transaction-modal')" class="flex flex-col items-center text-primary"><i data-lucide="plus-circle" class="w-8 h-8 -mt-2 drop-shadow-md"></i></button>

            <button onclick="navigateTo('budget')" class="flex flex-col items-center text-gray-600 hover:text-primary"><i data-lucide="target" class="w-5 h-5"></i></button>

            <button onclick="navigateTo('expenses')" class="flex flex-col items-center text-gray-600 hover:text-primary"><i data-lucide="receipt" class="w-5 h-5"></i></button>

        </div>

    </header>



    <!-- Conteúdo Principal -->

    <main id="main-container" class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">

        <!-- Conteúdo Dinâmico Injetado Aqui -->

    </main>



    <!-- Rodapé -->

    <footer class="bg-white border-t border-gray-200 py-4 mt-auto">

        <div class="container mx-auto px-4 text-center sm:text-left text-xs text-gray-500 flex flex-col sm:flex-row justify-between">

            <p>© 2025 DuoFund. Gerenciando finanças juntos.</p>

            <div class="space-x-4 mt-2 sm:mt-0">

                <a href="#" class="hover:text-primary">Privacidade</a>

                <a href="#" class="hover:text-primary">Termos</a>

            </div>

        </div>

    </footer>



    <!-- Modal de Transação -->

    <div id="transaction-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm" onclick="closeModal('transaction-modal')">

        <div class="modal-content bg-white w-full max-w-lg p-6 rounded-xl shadow-2xl mx-4 border-t-4 border-primary" onclick="event.stopPropagation()">

            <div class="flex justify-between items-center mb-4">

                <h3 class="text-xl font-bold text-gray-800">Nova Transação</h3>

                <button class="text-gray-400 hover:text-gray-600" onclick="closeModal('transaction-modal')"><i data-lucide="x" class="w-6 h-6"></i></button>

            </div>

            <form id="transaction-form" class="space-y-4">

                <div class="grid grid-cols-2 gap-4">

                    <div>

                        <label class="block text-sm font-medium text-gray-700">Tipo</label>

                        <select id="t-type" class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                            <option value="expense">Despesa</option>

                            <option value="income">Receita</option>

                        </select>

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-700">Valor (R$)</label>

                        <input type="number" id="t-amount" step="0.01" required class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                    </div>

                </div>

               

                <div>

                    <label class="block text-sm font-medium text-gray-700">Descrição</label>

                    <input type="text" id="t-desc" required placeholder="Ex: Compras Semanais" class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                </div>



                <div class="grid grid-cols-2 gap-4">

                    <div>

                        <label class="block text-sm font-medium text-gray-700">Categoria</label>

                        <select id="t-category" required class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                            <!-- Preenchido via JS -->

                        </select>

                    </div>

                    <div>

                        <label class="block text-sm font-medium text-gray-700">Data Inicial</label>

                        <input type="date" id="t-date" required class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                    </div>

                </div>



                <!-- Seção de Repetição/Parcelamento -->

                <div class="border-t pt-4 mt-2">

                    <label class="block text-sm font-medium text-gray-700 mb-2">Frequência</label>

                    <div class="flex space-x-4 mb-3">

                        <label class="flex items-center">

                            <input type="radio" name="repetition" value="single" checked class="text-primary focus:ring-primary h-4 w-4 border-gray-300" onclick="toggleRepetitionFields()">

                            <span class="ml-2 text-sm text-gray-700">Única</span>

                        </label>

                        <label class="flex items-center">

                            <input type="radio" name="repetition" value="recurring" class="text-primary focus:ring-primary h-4 w-4 border-gray-300" onclick="toggleRepetitionFields()">

                            <span class="ml-2 text-sm text-gray-700">Recorrente</span>

                        </label>

                        <label class="flex items-center">

                            <input type="radio" name="repetition" value="installment" class="text-primary focus:ring-primary h-4 w-4 border-gray-300" onclick="toggleRepetitionFields()">

                            <span class="ml-2 text-sm text-gray-700">Parcelada</span>

                        </label>

                    </div>



                    <!-- Campos Condicionais -->

                    <div id="recurring-fields" class="hidden bg-blue-50 p-3 rounded-lg border border-blue-100">

                        <label class="block text-sm font-medium text-gray-700 mb-1">Repetir até quando?</label>

                        <input type="date" id="t-recur-end" class="block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                    </div>



                    <div id="installment-fields" class="hidden bg-yellow-50 p-3 rounded-lg border border-yellow-100">

                        <label class="block text-sm font-medium text-gray-700 mb-1">Número de Parcelas</label>

                        <input type="number" id="t-installments" min="2" max="60" placeholder="Ex: 12" class="block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                    </div>

                </div>



                <div class="flex justify-end pt-4">

                    <button type="button" onclick="closeModal('transaction-modal')" class="mr-3 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancelar</button>

                    <button type="submit" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-secondary font-medium transition shadow-md">Salvar</button>

                </div>

            </form>

        </div>

    </div>



    <!-- Modal de Categoria -->

    <div id="category-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm" onclick="closeModal('category-modal')">

        <div class="modal-content bg-white w-full max-w-sm p-6 rounded-xl shadow-2xl mx-4 border-t-4 border-secondary" onclick="event.stopPropagation()">

            <div class="flex justify-between items-center mb-4">

                <h3 id="modal-cat-title" class="text-xl font-bold text-gray-800">Nova Categoria</h3>

                <button class="text-gray-400 hover:text-gray-600" onclick="closeModal('category-modal')"><i data-lucide="x" class="w-6 h-6"></i></button>

            </div>

            <form id="category-form" class="space-y-4">

                <div>

                    <label class="block text-sm font-medium text-gray-700">Nome</label>

                    <input type="text" id="c-name" required placeholder="Ex: Pets, Lazer" class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                </div>

                <div>

                    <label class="block text-sm font-medium text-gray-700">Limite Mensal (R$)</label>

                    <input type="number" id="c-limit" required value="100" class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-primary focus:border-primary">

                </div>

                <div class="flex justify-end pt-4">

                     <button type="button" onclick="closeModal('category-modal')" class="mr-3 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancelar</button>

                    <button type="submit" id="btn-cat-submit" class="bg-secondary text-white px-4 py-2 rounded-lg hover:bg-primary font-medium transition shadow-md">Adicionar</button>

                </div>

            </form>

        </div>

    </div>



    <!-- Modal de Meta -->

    <div id="goal-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm" onclick="closeModal('goal-modal')">

        <div class="modal-content bg-white w-full max-w-sm p-6 rounded-xl shadow-2xl mx-4 border-t-4 border-accent" onclick="event.stopPropagation()">

            <div class="flex justify-between items-center mb-4">

                <h3 class="text-xl font-bold text-gray-800">Nova Meta</h3>

                <button class="text-gray-400 hover:text-gray-600" onclick="closeModal('goal-modal')"><i data-lucide="x" class="w-6 h-6"></i></button>

            </div>

            <form id="goal-form" class="space-y-4">

                <div>

                    <label class="block text-sm font-medium text-gray-700">Nome da Meta</label>

                    <input type="text" id="g-name" required placeholder="Ex: Viagem Europa, Carro Novo" class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-accent focus:border-accent">

                </div>

                <div>

                    <label class="block text-sm font-medium text-gray-700">Valor Alvo (R$)</label>

                    <input type="number" id="g-target" required placeholder="10000.00" class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-accent focus:border-accent">

                </div>

                <div>

                    <label class="block text-sm font-medium text-gray-700">Já Guardado (R$)</label>

                    <input type="number" id="g-current" required value="0" class="mt-1 block w-full rounded-lg border-gray-300 border p-2 focus:ring-accent focus:border-accent">

                </div>

                <div class="flex justify-end pt-4">

                     <button type="button" onclick="closeModal('goal-modal')" class="mr-3 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">Cancelar</button>

                    <button type="submit" class="bg-accent text-white px-4 py-2 rounded-lg hover:bg-yellow-600 font-medium transition shadow-md">Criar Meta</button>

                </div>

            </form>

        </div>

    </div>



    <!-- Message Box -->

    <div id="message-box" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg hidden z-50"></div>



    <!-- Firebase & Lógica -->

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        import { getFirestore, doc, onSnapshot, collection, setDoc, addDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";



        // Configuração

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;



        let db, auth, userId = null;

        let sharedState = {

            balance: 0,

            budgetLimit: 2000,

            budgetUsed: 0,

            categories: { 'Mercado': 500, 'Aluguel': 1200, 'Contas': 200, 'Restaurantes': 150, 'Transporte': 100, 'Renda': 10000 }

        };

        let transactions = [];

        let goals = [];

        let currentPage = 'dashboard';



        // --- Funções Principais ---

       

        async function initApp() {

            const app = initializeApp(firebaseConfig);

            db = getFirestore(app);

            auth = getAuth(app);

            await setPersistence(auth, browserSessionPersistence);

           

            if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);

            else await signInAnonymously(auth);



            onAuthStateChanged(auth, (user) => {

                if(user) {

                    userId = user.uid;

                    document.getElementById('user-status').textContent = 'Conectado';

                    startListeners();

                }

            });

        }



        function startListeners() {

            const stateDoc = doc(db, 'artifacts', appId, 'public', 'data', 'finances', 'shared_state');

            const txCol = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');

            const goalsCol = collection(db, 'artifacts', appId, 'public', 'data', 'goals');



            onSnapshot(stateDoc, (snap) => {

                if(snap.exists()) {

                    sharedState = { ...sharedState, ...snap.data() };

                    renderPage(currentPage);

                } else {

                    setDoc(stateDoc, sharedState);

                }

            });



            onSnapshot(txCol, (snap) => {

                transactions = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => new Date(b.date) - new Date(a.date));

                updateCalculations();

                renderPage(currentPage);

            });



            onSnapshot(goalsCol, (snap) => {

                goals = snap.docs.map(d => ({id: d.id, ...d.data()}));

                renderPage(currentPage);

            });

        }



        function updateCalculations() {

            const now = new Date();

            const currentMonthExpenses = transactions.filter(t =>

                t.type === 'expense' &&

                new Date(t.date).getMonth() === now.getMonth() &&

                new Date(t.date).getFullYear() === now.getFullYear()

            );



            const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + (t.amount || 0), 0);

            const totalExpense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + (t.amount || 0), 0);

           

            sharedState.balance = totalIncome - totalExpense;

            sharedState.budgetUsed = currentMonthExpenses.reduce((s, t) => s + (t.amount || 0), 0);

        }



        // --- Renderização da UI ---



        window.formatCurrency = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);



        window.renderPage = (page) => {

            currentPage = page;

            updateActiveLink(page);

            const container = document.getElementById('main-container');

           

            if (page === 'dashboard') container.innerHTML = getDashboardHTML();

            else if (page === 'expenses') container.innerHTML = getExpensesHTML();

            else if (page === 'budget') container.innerHTML = getBudgetHTML();

            else if (page === 'goals') container.innerHTML = getGoalsHTML();

           

            lucide.createIcons();

        }



        function updateActiveLink(page) {

            document.querySelectorAll('.nav-link').forEach(link => {

                const btn = link.querySelector('button');

                if(link.dataset.page === page) {

                    btn.classList.add('active');

                    btn.classList.remove('text-gray-600');

                } else {

                    btn.classList.remove('active');

                    btn.classList.add('text-gray-600');

                }

            });

        }



        // 1. Template do Painel (Dashboard)

        function getDashboardHTML() {

            const now = new Date();

            const monthTx = transactions.filter(t => t.type === 'expense' && new Date(t.date).getMonth() === now.getMonth());

            const catUsage = {};

            monthTx.forEach(t => catUsage[t.category] = (catUsage[t.category] || 0) + t.amount);



            const categoryList = Object.keys(sharedState.categories).filter(c => c !== 'Renda' && c !== 'Income').slice(0, 5).map(cat => {

                const limit = sharedState.categories[cat];

                const used = catUsage[cat] || 0;

                const pct = Math.min(100, Math.round((used / limit) * 100));

                const color = pct > 90 ? 'bg-red-500' : 'bg-primary';

               

                return `

                    <div class="flex items-center mb-4 last:mb-0">

                        <div class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center mr-4">

                            <i data-lucide="tag" class="w-5 h-5 text-gray-500"></i>

                        </div>

                        <div class="flex-grow">

                            <div class="flex justify-between text-sm mb-1">

                                <span class="font-semibold text-gray-800">${cat}</span>

                                <span class="text-gray-500">${formatCurrency(used)} / ${formatCurrency(limit)}</span>

                            </div>

                            <div class="w-full bg-gray-200 rounded-full h-2">

                                <div class="${color} h-2 rounded-full" style="width: ${pct}%"></div>

                            </div>

                        </div>

                    </div>`;

            }).join('');



            const recentTx = transactions.slice(0, 5).map(t => {

                const isInc = t.type === 'income';

                return `

                    <div class="flex justify-between items-center py-3 border-b last:border-0 border-gray-100">

                        <div class="flex items-center">

                            <div class="w-8 h-8 rounded-full ${isInc ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-600'} flex items-center justify-center mr-3">

                                <i data-lucide="${isInc ? 'trending-up' : 'shopping-bag'}" class="w-4 h-4"></i>

                            </div>

                            <div>

                                <p class="font-medium text-gray-800">${t.description}</p>

                                <p class="text-xs text-gray-500">${new Date(t.date).toLocaleDateString('pt-BR')} • ${t.category}</p>

                            </div>

                        </div>

                        <span class="font-bold ${isInc ? 'text-green-600' : 'text-gray-900'}">${isInc?'+':'-'}${formatCurrency(t.amount)}</span>

                    </div>`;

            }).join('');



            return `

                <div class="flex justify-between items-center mb-6">

                    <div>

                        <h1 class="text-2xl font-bold text-gray-900">Painel Geral</h1>

                        <p class="text-sm text-gray-500">Visão geral das finanças compartilhadas</p>

                    </div>

                    <button onclick="openModal('transaction-modal')" class="bg-primary hover:bg-secondary text-white font-semibold py-2 px-4 rounded-xl shadow-md flex items-center transition">

                        <i data-lucide="plus" class="w-4 h-4 mr-2"></i> Nova Transação

                    </button>

                </div>



                <!-- Cards do Topo -->

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

                    <div class="bg-primary text-white p-6 rounded-xl shadow-lg shadow-blue-200/50">

                        <p class="text-blue-100 text-sm font-medium mb-1">Saldo Total</p>

                        <p class="text-3xl font-extrabold">${formatCurrency(sharedState.balance)}</p>

                    </div>

                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">

                        <div class="flex justify-between mb-2">

                            <p class="text-gray-500 text-sm font-medium">Orçamento Mensal</p>

                            <span class="text-xs font-bold bg-gray-100 text-gray-700 px-2 py-1 rounded-full border border-gray-200">${Math.round((sharedState.budgetUsed/sharedState.budgetLimit)*100)}% Usado</span>

                        </div>

                        <p class="text-2xl font-bold text-gray-900 mb-2">${formatCurrency(sharedState.budgetUsed)} <span class="text-sm font-normal text-gray-400">/ ${formatCurrency(sharedState.budgetLimit)}</span></p>

                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div class="bg-accent h-1.5 rounded-full" style="width: ${Math.min(100, (sharedState.budgetUsed/sharedState.budgetLimit)*100)}%"></div></div>

                    </div>

                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">

                         <p class="text-gray-500 text-sm font-medium mb-1">Orçamento Restante</p>

                         <p class="text-3xl font-bold text-gray-900">${formatCurrency(sharedState.budgetLimit - sharedState.budgetUsed)}</p>

                         <p class="text-xs text-primary mt-1">Disponível para gastar</p>

                    </div>

                </div>



                <!-- Grid Principal -->

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">

                    <!-- Esquerda: Categorias -->

                    <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">

                        <h2 class="text-lg font-bold text-gray-900 mb-4">Gastos por Categoria</h2>

                        ${categoryList || '<p class="text-gray-400">Nenhum dado de gasto ainda.</p>'}

                    </div>

                    <!-- Direita: Recentes -->

                    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100">

                        <h2 class="text-lg font-bold text-gray-900 mb-4">Atividade Recente</h2>

                        ${recentTx || '<p class="text-gray-400">Nenhuma transação encontrada.</p>'}

                        <button onclick="renderPage('expenses')" class="w-full mt-4 text-center text-primary text-sm font-medium hover:underline">Ver Todas</button>

                    </div>

                </div>



                <!-- Ações Rápidas -->

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">

                     <button onclick="openModal('transaction-modal')" class="p-4 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 transition flex flex-col items-center">

                        <i data-lucide="minus-circle" class="w-6 h-6 text-red-500 mb-2"></i> <span class="text-sm font-medium text-gray-700">Add Despesa</span>

                     </button>

                     <button onclick="openModal('transaction-modal')" class="p-4 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 transition flex flex-col items-center">

                        <i data-lucide="plus-circle" class="w-6 h-6 text-green-500 mb-2"></i> <span class="text-sm font-medium text-gray-700">Add Receita</span>

                     </button>

                     <button onclick="openCategoryModal()" class="p-4 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 transition flex flex-col items-center">

                        <i data-lucide="tag" class="w-6 h-6 text-secondary mb-2"></i> <span class="text-sm font-medium text-gray-700">Nova Categoria</span>

                     </button>

                     <button onclick="openModal('goal-modal')" class="p-4 bg-white border border-gray-200 rounded-xl hover:border-primary hover:bg-blue-50 transition flex flex-col items-center">

                        <i data-lucide="trophy" class="w-6 h-6 text-accent mb-2"></i> <span class="text-sm font-medium text-gray-700">Nova Meta</span>

                     </button>

                </div>

            `;

        }



        // 2. Template de Despesas

        function getExpensesHTML() {

            const rows = transactions.map(t => {

                let badge = '';

                if(t.installmentCount) badge = `<span class="ml-2 px-1.5 py-0.5 bg-yellow-100 text-yellow-800 rounded text-[10px] font-bold">PARCELADO</span>`;

                else if(t.isRecurring) badge = `<span class="ml-2 px-1.5 py-0.5 bg-blue-100 text-blue-800 rounded text-[10px] font-bold">RECORRENTE</span>`;



                return `

                <tr class="hover:bg-gray-50 group">

                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">

                        ${t.description} ${badge}

                    </td>

                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><span class="px-2 py-1 bg-gray-100 rounded-md text-xs">${t.category}</span></td>

                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${new Date(t.date).toLocaleDateString('pt-BR')}</td>

                    <td class="px-6 py-4 whitespace-nowrap text-sm font-bold ${t.type==='income'?'text-green-600':'text-gray-900'} text-right">${t.type==='income'?'+':'-'}${formatCurrency(t.amount)}</td>

                    <td class="px-6 py-4 text-right">

                        <button onclick="deleteTx('${t.id}')" class="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                    </td>

                </tr>

            `}).join('');



            return `

                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">

                        <div>

                            <h2 class="text-xl font-bold text-gray-900">Todas as Transações</h2>

                            <p class="text-sm text-gray-500">Histórico de todas as receitas, despesas, parcelas e recorrentes</p>

                        </div>

                        <div class="flex space-x-2">

                             <input type="text" placeholder="Buscar..." class="hidden sm:block border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-primary">

                             <button onclick="openModal('transaction-modal')" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-secondary transition">Novo</button>

                        </div>

                    </div>

                    <div class="overflow-x-auto">

                        <table class="min-w-full divide-y divide-gray-200">

                            <thead class="bg-gray-50">

                                <tr>

                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Descrição</th>

                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Categoria</th>

                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Data</th>

                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Valor</th>

                                    <th class="px-6 py-3"></th>

                                </tr>

                            </thead>

                            <tbody class="divide-y divide-gray-200">

                                ${rows || '<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Nenhuma transação ainda.</td></tr>'}

                            </tbody>

                        </table>

                    </div>

                </div>

            `;

        }



        // 3. Template de Orçamento

        function getBudgetHTML() {

            const now = new Date();

            const monthTx = transactions.filter(t => t.type === 'expense' && new Date(t.date).getMonth() === now.getMonth());

            const catUsage = {};

            monthTx.forEach(t => catUsage[t.category] = (catUsage[t.category] || 0) + t.amount);



            const cards = Object.keys(sharedState.categories).filter(c => c !== 'Renda' && c !== 'Income').map(cat => {

                const limit = sharedState.categories[cat];

                const used = catUsage[cat] || 0;

                const pct = Math.round((used/limit)*100);

                const color = pct > 100 ? 'bg-red-500' : (pct > 75 ? 'bg-accent' : 'bg-primary');

                const textCol = pct > 100 ? 'text-red-500' : (pct > 75 ? 'text-accent' : 'text-primary');



                // Adicionado botão de editar (Lápis)

                return `

                    <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition">

                        <div class="flex justify-between items-start mb-2">

                            <h3 class="font-semibold text-gray-800">${cat}</h3>

                            <span class="text-xs font-bold ${textCol}">${pct}%</span>

                        </div>

                        <p class="text-xs text-gray-500 mb-3">${formatCurrency(used)} de ${formatCurrency(limit)}</p>

                        <div class="w-full bg-gray-100 rounded-full h-2 mb-3">

                            <div class="${color} h-2 rounded-full" style="width: ${Math.min(100, pct)}%"></div>

                        </div>

                        <div class="flex justify-between items-center text-xs">

                             <span class="text-gray-400">Restante: <b class="text-gray-700">${formatCurrency(limit - used)}</b></span>

                             <div class="flex space-x-2">

                                <button onclick="editCategory('${cat}', ${limit})" class="text-blue-400 hover:text-blue-600"><i data-lucide="pencil" class="w-3 h-3"></i></button>

                                <button onclick="removeCategory('${cat}')" class="text-red-400 hover:text-red-600"><i data-lucide="trash" class="w-3 h-3"></i></button>

                             </div>

                        </div>

                    </div>

                `;

            }).join('');



            return `

                <div class="mb-6">

                     <h1 class="text-2xl font-bold text-gray-900">Orçamentos Mensais</h1>

                     <p class="text-sm text-gray-500">Defina e edite os limites para cada categoria.</p>

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                    ${cards}

                    <button onclick="openCategoryModal()" class="flex flex-col items-center justify-center p-6 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 text-gray-500 hover:border-primary hover:text-primary transition min-h-[160px]">

                        <i data-lucide="plus-circle" class="w-8 h-8 mb-2"></i>

                        <span class="font-medium">Nova Categoria de Orçamento</span>

                    </button>

                </div>

            `;

        }



        // 4. Template de Metas

        function getGoalsHTML() {

            const goalCards = goals.map(g => {

                const pct = Math.round((g.current / g.target) * 100);

                return `

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-md transition">

                    <div>

                        <div class="flex justify-between items-start mb-4">

                            <div class="w-12 h-12 bg-yellow-50 rounded-full flex items-center justify-center text-accent">

                                <i data-lucide="trophy" class="w-6 h-6"></i>

                            </div>

                            <button onclick="deleteGoal('${g.id}')" class="text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

                        </div>

                        <h3 class="text-lg font-bold text-gray-900 mb-1">${g.name}</h3>

                        <p class="text-sm text-gray-500 mb-4">Meta: ${formatCurrency(g.target)}</p>

                       

                        <div class="flex justify-between text-sm mb-1 font-medium">

                            <span class="text-primary">${pct}% Concluído</span>

                            <span class="text-gray-900">${formatCurrency(g.current)}</span>

                        </div>

                        <div class="w-full bg-gray-100 rounded-full h-2.5 mb-4">

                            <div class="bg-accent h-2.5 rounded-full" style="width: ${Math.min(100, pct)}%"></div>

                        </div>

                    </div>

                    <button class="w-full py-2 bg-gray-50 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-100 transition border border-gray-200">

                        Adicionar Valor

                    </button>

                </div>

                `;

            }).join('');



            return `

                <div class="flex justify-between items-end mb-6">

                    <div>

                        <h1 class="text-2xl font-bold text-gray-900">Metas Financeiras</h1>

                        <p class="text-sm text-gray-500">Acompanhe seus sonhos e objetivos de longo prazo.</p>

                    </div>

                    <button onclick="openModal('goal-modal')" class="bg-accent text-white px-4 py-2 rounded-lg font-medium hover:bg-yellow-600 transition shadow-sm flex items-center">

                        <i data-lucide="plus" class="w-4 h-4 mr-2"></i> Criar Nova Meta

                    </button>

                </div>



                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                    ${goalCards || '<div class="col-span-3 p-12 text-center bg-white rounded-xl border border-gray-200 text-gray-400">Nenhuma meta criada ainda. Defina um objetivo para começar!</div>'}

                </div>

            `;

        }



        // --- Modais e Interações ---

       

        window.openModal = (id) => {

            document.getElementById(id).classList.add('active');

            if(id === 'transaction-modal') populateCatSelect();

            if(id === 'transaction-modal') {

                document.getElementById('t-date').valueAsDate = new Date();

                // Reset repetition UI

                document.querySelector('input[name="repetition"][value="single"]').checked = true;

                toggleRepetitionFields();

            }

        }

       

        window.closeModal = (id) => document.getElementById(id).classList.remove('active');



        // Função específica para abrir o modal de categoria em modo "Novo"

        window.openCategoryModal = () => {

            document.getElementById('category-form').reset();

            document.getElementById('c-name').readOnly = false; // Permitir edição do nome

            document.getElementById('c-name').classList.remove('bg-gray-100'); // Remover estilo de bloqueado

            document.getElementById('modal-cat-title').innerText = 'Nova Categoria';

            document.getElementById('btn-cat-submit').innerText = 'Adicionar';

            openModal('category-modal');

        }



        // Função para abrir o modal de categoria em modo "Editar"

        window.editCategory = (name, limit) => {

            document.getElementById('c-name').value = name;

            document.getElementById('c-name').readOnly = true; // Bloquear edição do nome para garantir update correto

            document.getElementById('c-name').classList.add('bg-gray-100'); // Adicionar estilo visual de bloqueado

            document.getElementById('c-limit').value = limit;

           

            document.getElementById('modal-cat-title').innerText = 'Editar Categoria';

            document.getElementById('btn-cat-submit').innerText = 'Salvar';

           

            openModal('category-modal');

        }



        function populateCatSelect() {

            const sel = document.getElementById('t-category');

            sel.innerHTML = Object.keys(sharedState.categories).map(c => `<option value="${c}">${c}</option>`).join('');

        }



        window.toggleRepetitionFields = () => {

            const type = document.querySelector('input[name="repetition"]:checked').value;

            const recurDiv = document.getElementById('recurring-fields');

            const installDiv = document.getElementById('installment-fields');

           

            recurDiv.classList.add('hidden');

            installDiv.classList.add('hidden');

            document.getElementById('t-recur-end').required = false;

            document.getElementById('t-installments').required = false;



            if (type === 'recurring') {

                recurDiv.classList.remove('hidden');

                document.getElementById('t-recur-end').required = true;

            } else if (type === 'installment') {

                installDiv.classList.remove('hidden');

                document.getElementById('t-installments').required = true;

            }

        }



        // --- Event Listeners e Handlers ---



        // Enviar Transação

        document.getElementById('transaction-form').addEventListener('submit', async (e) => {

            e.preventDefault();

           

            const typeRep = document.querySelector('input[name="repetition"]:checked').value;

            const desc = document.getElementById('t-desc').value;

            const amount = parseFloat(document.getElementById('t-amount').value);

            const type = document.getElementById('t-type').value;

            const category = document.getElementById('t-category').value;

            const baseDate = new Date(document.getElementById('t-date').value);

           

            const batch = writeBatch(db);

            const txColRef = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');



            const baseData = {

                type, amount, category, userId,

                timestamp: new Date().toISOString()

            };



            if (typeRep === 'single') {

                // Single Transaction

                const docRef = doc(txColRef);

                batch.set(docRef, {

                    ...baseData,

                    description: desc,

                    date: baseDate.toISOString().split('T')[0],

                    isRecurring: false,

                    isInstallment: false

                });



            } else if (typeRep === 'installment') {

                // Installments

                const count = parseInt(document.getElementById('t-installments').value);

                for (let i = 0; i < count; i++) {

                    const docRef = doc(txColRef);

                    const currentDate = new Date(baseDate);

                    currentDate.setMonth(currentDate.getMonth() + i);

                   

                    batch.set(docRef, {

                        ...baseData,

                        description: `${desc} (${i+1}/${count})`,

                        date: currentDate.toISOString().split('T')[0],

                        isRecurring: false,

                        isInstallment: true,

                        installmentCurrent: i+1,

                        installmentCount: count

                    });

                }

            } else if (typeRep === 'recurring') {

                // Recurring until date

                const endDate = new Date(document.getElementById('t-recur-end').value);

                let currentDate = new Date(baseDate);

               

                // Prevent infinite loops if end date is invalid (max 5 years)

                let safetyCounter = 0;

                while (currentDate <= endDate && safetyCounter < 60) {

                    const docRef = doc(txColRef);

                    batch.set(docRef, {

                        ...baseData,

                        description: desc,

                        date: currentDate.toISOString().split('T')[0],

                        isRecurring: true, // Marker for styling

                        isInstallment: false

                    });

                   

                    // Add 1 month

                    currentDate.setMonth(currentDate.getMonth() + 1);

                    safetyCounter++;

                }

            }

           

            await batch.commit();

            closeModal('transaction-modal');

            e.target.reset();

            showMsg('Transação salva com sucesso!');

        });



        // Enviar Categoria (Novo ou Edição)

        document.getElementById('category-form').addEventListener('submit', async (e) => {

            e.preventDefault();

            const name = document.getElementById('c-name').value;

            const limit = parseFloat(document.getElementById('c-limit').value);

           

            const newCats = { ...sharedState.categories, [name]: limit };

            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'finances', 'shared_state'), { categories: newCats });

           

            closeModal('category-modal');

            e.target.reset();

            showMsg(`Categoria ${name} salva!`);

        });



        // Enviar Meta

        document.getElementById('goal-form').addEventListener('submit', async (e) => {

            e.preventDefault();

            const data = {

                name: document.getElementById('g-name').value,

                target: parseFloat(document.getElementById('g-target').value),

                current: parseFloat(document.getElementById('g-current').value),

                timestamp: new Date().toISOString()

            };



            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'goals'), data);

            closeModal('goal-modal');

            e.target.reset();

            showMsg('Meta criada com sucesso!');

        });

       

        // Excluir Transação

        window.deleteTx = async (id) => {

            if(confirm('Excluir esta transação?')) {

                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'transactions', id));

                showMsg('Transação excluída.');

            }

        }



        // Excluir Meta

        window.deleteGoal = async (id) => {

            if(confirm('Excluir esta meta?')) {

                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'goals', id));

                showMsg('Meta removida.');

            }

        }

       

        // Remover Categoria

        window.removeCategory = async (catName) => {

            if(confirm(`Remover categoria ${catName}?`)) {

                 const newCats = { ...sharedState.categories };

                 delete newCats[catName];

                 await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'finances', 'shared_state'), { categories: newCats });

                 showMsg('Categoria removida.');

            }

        }



        function showMsg(txt) {

            const box = document.getElementById('message-box');

            box.innerText = txt;

            box.classList.remove('hidden');

            setTimeout(() => box.classList.add('hidden'), 3000);

        }



        // Boot

        window.navigateTo = (p) => renderPage(p);

        initApp();

        renderPage('dashboard');



    </script>

</body>

</html>
